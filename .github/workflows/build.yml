name: eBPF EDR Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install eBPF build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev linux-tools-common
          case "$(uname -r)" in
            *azure*) sudo apt-get install -y linux-tools-azure ;;
            *lowlatency*) sudo apt-get install -y linux-lowlatency-tools-common || true ;;
            *) sudo apt-get install -y linux-tools-generic ;;
          esac

          BPFTOOL_BIN=""
          for p in /usr/lib/linux-tools/*/bpftool /usr/lib/linux-tools-*/bpftool; do
            if [ -x "$p" ] && [ ! -L "$p" ]; then
              BPFTOOL_BIN="$p"
              break
            fi
          done

          if [ -z "$BPFTOOL_BIN" ]; then
            echo "No standalone bpftool binary was installed"
            find /usr/lib/linux-tools -maxdepth 2 -type f -name bpftool -print || true
            exit 1
          fi

          echo "Using bpftool: $BPFTOOL_BIN"
          "$BPFTOOL_BIN" version
          sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool

      - name: Generate kernel BTF header
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          test -s bpf/vmlinux.h
          wc -l bpf/vmlinux.h

      - name: Verify Go module path
        run: |
          set -euo pipefail
          test "$(go list -m)" = "github.com/locallhosts/ebpf-edr"

          if git grep -n "github.com/portfolio/ebpf-edr" -- ':!.github/workflows/build.yml'; then
            echo "Found stale tracked module references"
            exit 1
          fi

      - name: Build eBPF and XDP objects
        run: make bpf xdp

      - name: Build agent for Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o /tmp/edr-agent-linux-amd64 ./agent

      - name: Build agent for Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -o /tmp/edr-agent-linux-arm64 ./agent

      - name: Compile agent tests
        run: go test ./agent

      - name: Security validation and benchmarks
        run: bash tests/security_validation.sh

      - name: Package Linux release archives
        run: |
          set -euo pipefail
          VERSION="v1.0.0"
          mkdir -p dist/amd64 dist/arm64

          cp /tmp/edr-agent-linux-amd64 dist/amd64/edr-agent
          cp /tmp/edr-agent-linux-arm64 dist/arm64/edr-agent

          tar -C dist/amd64 -czf "dist/ebpf-edr-${VERSION}-linux-amd64.tar.gz" edr-agent
          tar -C dist/arm64 -czf "dist/ebpf-edr-${VERSION}-linux-arm64.tar.gz" edr-agent

          cd dist
          sha256sum "ebpf-edr-${VERSION}-linux-amd64.tar.gz" \
                    "ebpf-edr-${VERSION}-linux-arm64.tar.gz" > SHA256SUMS

          ls -lh .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-edr-v1.0.0-linux
          path: |
            dist/ebpf-edr-v1.0.0-linux-amd64.tar.gz
            dist/ebpf-edr-v1.0.0-linux-arm64.tar.gz
            dist/SHA256SUMS
