name: eBPF EDR Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install eBPF build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev linux-tools-common
          case "$(uname -r)" in
            *azure*) sudo apt-get install -y linux-tools-azure ;;
            *lowlatency*) sudo apt-get install -y linux-lowlatency-tools-common || true ;;
            *) sudo apt-get install -y linux-tools-generic ;;
          esac

          # Ubuntu's /usr/sbin/bpftool can be a kernel-version wrapper. The
          # hosted runner may be running a kernel whose exact tools package is
          # unavailable, while a compatible bpftool binary is already installed
          # under /usr/lib/linux-tools/<version>. Prefer that real binary.
          BPFTOOL_BIN=""
          for p in /usr/lib/linux-tools/*/bpftool /usr/lib/linux-tools-*/bpftool; do
            if [ -x "$p" ] && [ ! -L "$p" ]; then
              BPFTOOL_BIN="$p"
              break
            fi
          done

          if [ -z "$BPFTOOL_BIN" ]; then
            echo "No standalone bpftool binary was installed"
            find /usr/lib/linux-tools -maxdepth 2 -type f -name bpftool -print || true
            exit 1
          fi

          echo "Using bpftool: $BPFTOOL_BIN"
          "$BPFTOOL_BIN" version
          sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool

      - name: Build eBPF object
        run: make bpf

      - name: Build agent
        run: go build -o /tmp/edr-agent ./agent

      - name: Compile agent tests
        run: go test ./agent
