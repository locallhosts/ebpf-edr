name: eBPF EDR Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev linux-tools-common
          case "$(uname -r)" in
            *azure*) sudo apt-get install -y linux-tools-azure ;;
            *lowlatency*) sudo apt-get install -y linux-lowlatency-tools-common || true ;;
            *) sudo apt-get install -y linux-tools-generic ;;
          esac
          if ! command -v bpftool >/dev/null 2>&1; then
            for p in /usr/lib/linux-tools/*/bpftool /usr/lib/linux-tools-*/bpftool; do
              if [ -x "$p" ]; then
                sudo ln -sf "$p" /usr/local/bin/bpftool
                break
              fi
            done
          fi
          command -v bpftool
          bpftool version

      - name: Build eBPF object
        run: make bpf

      - name: Build agent
        run: go build -o /tmp/edr-agent ./agent

      - name: Compile agent tests
        run: go test ./agent
