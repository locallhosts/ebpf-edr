name: eBPF EDR Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install eBPF build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev linux-tools-common
          case "$(uname -r)" in
            *azure*) sudo apt-get install -y linux-tools-azure ;;
            *lowlatency*) sudo apt-get install -y linux-lowlatency-tools-common || true ;;
            *) sudo apt-get install -y linux-tools-generic ;;
          esac

          BPFTOOL_BIN=""
          for p in /usr/lib/linux-tools/*/bpftool /usr/lib/linux-tools-*/bpftool; do
            if [ -x "$p" ] && [ ! -L "$p" ]; then
              BPFTOOL_BIN="$p"
              break
            fi
          done

          if [ -z "$BPFTOOL_BIN" ]; then
            echo "No standalone bpftool binary was installed"
            find /usr/lib/linux-tools -maxdepth 2 -type f -name bpftool -print || true
            exit 1
          fi

          echo "Using bpftool: $BPFTOOL_BIN"
          "$BPFTOOL_BIN" version
          sudo ln -sf "$BPFTOOL_BIN" /usr/local/bin/bpftool

      - name: Generate kernel BTF header
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          test -s bpf/vmlinux.h
          wc -l bpf/vmlinux.h

      - name: Verify Go module path
        run: |
          test "$(go list -m)" = "github.com/locallhosts/ebpf-edr"
          if grep -R --exclude-dir=.git -n "github.com/portfolio/ebpf-edr" .; then
            echo "Found stale module references"
            exit 1
          fi

      - name: Build eBPF and XDP objects
        run: make bpf xdp

      - name: Build agent
        run: go build -o /tmp/edr-agent ./agent

      - name: Compile agent tests
        run: go test ./agent

      - name: Security validation and benchmarks
        run: bash tests/security_validation.sh

      - name: Package Linux agent
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/edr-agent dist/edr-agent-linux-amd64
          tar -C dist -czf dist/ebpf-edr-linux-amd64.tar.gz edr-agent-linux-amd64
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-edr-linux-amd64
          path: dist/
